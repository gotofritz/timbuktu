version: 2
updates:
  # Minor and patch bumps come as one PR per ecosystem; a major bump gets its
  # own PR, because it may need code changes.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      # modernc.org/* (pure-Go SQLite stack) release together; keep a major
      # bump of theirs in one PR too
      modernc:
        patterns:
          - "modernc.org/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
